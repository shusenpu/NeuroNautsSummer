
    <svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <title id="title">Fig 10 Hh Circuit</title>
  <desc id="desc">Fig 10 Hh Circuit teaching figure for the neuroscience minibook; see surrounding caption for interpretation.</desc>
      <rect width="900" height="620" fill="#ffffff"/>
      <defs>
        <style>
          .wire{stroke:#0f172a;stroke-width:5;fill:none;stroke-linecap:round}
          .cap{stroke:#0f172a;stroke-width:7}
          .box{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:10}
          .leak{fill:#f8fafc;stroke:#475569;stroke-width:3;rx:10}
          .label{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#334155}
        </style>
      </defs>
      <text x="45" y="55" class="label">Hodgkin-Huxley equivalent circuit</text>
      <text x="45" y="88" class="small">Membrane capacitance is in parallel with Na, K, and leak pathways.</text>
      <path d="M115 155 H790" class="wire"/>
      <path d="M115 470 H790" class="wire"/>
      <text x="45" y="162" class="small">outside</text>
      <text x="58" y="478" class="small">inside</text>
      <text x="805" y="322" class="label">V_m</text>

      <path d="M205 155 V255" class="wire"/>
      <line x1="175" y1="255" x2="235" y2="255" class="cap"/>
      <line x1="175" y1="290" x2="235" y2="290" class="cap"/>
      <path d="M205 290 V470" class="wire"/>
      <text x="160" y="350" class="label">C_m</text>
      <text x="128" y="378" class="small">membrane</text>
      <text x="128" y="402" class="small">capacitance</text>

      <path d="M375 155 V210" class="wire"/>
      <rect x="315" y="210" width="120" height="62" class="box"/>
      <text x="375" y="249" text-anchor="middle" class="label">g_Na</text>
      <path d="M375 272 V340" class="wire"/>
      <circle cx="375" cy="374" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
      <text x="375" y="381" text-anchor="middle" class="small">E_Na</text>
      <path d="M375 406 V470" class="wire"/>

      <path d="M540 155 V210" class="wire"/>
      <rect x="480" y="210" width="120" height="62" class="box"/>
      <text x="540" y="249" text-anchor="middle" class="label">g_K</text>
      <path d="M540 272 V340" class="wire"/>
      <circle cx="540" cy="374" r="32" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
      <text x="540" y="381" text-anchor="middle" class="small">E_K</text>
      <path d="M540 406 V470" class="wire"/>

      <path d="M705 155 V210" class="wire"/>
      <rect x="645" y="210" width="120" height="62" class="leak"/>
      <text x="705" y="249" text-anchor="middle" class="label">g_L</text>
      <path d="M705 272 V340" class="wire"/>
      <circle cx="705" cy="374" r="32" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
      <text x="705" y="381" text-anchor="middle" class="small">E_L</text>
      <path d="M705 406 V470" class="wire"/>

      <text x="375" y="530" text-anchor="middle" class="small">Na path</text>
      <text x="540" y="530" text-anchor="middle" class="small">K path</text>
      <text x="705" y="530" text-anchor="middle" class="small">leak path</text>
      <text x="450" y="580" text-anchor="middle" class="small">Each open pathway pulls V_m toward its E value.</text>
    </svg>
    