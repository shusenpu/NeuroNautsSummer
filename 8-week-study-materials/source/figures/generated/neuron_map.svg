
    <svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <title id="title">Neuron Map</title>
  <desc id="desc">Neuron Map teaching figure for the neuroscience minibook; see surrounding caption for interpretation.</desc>
      <rect width="1200" height="520" fill="#ffffff"/>
      <defs>
        <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
        </marker>
        <style>
          .line{stroke:#155e75;stroke-width:18;stroke-linecap:round;fill:none}
          .thin{stroke:#0f172a;stroke-width:3;fill:none;marker-end:url(#arrow2)}
          .label{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:19px;fill:#334155}
        </style>
      </defs>
      <text x="45" y="55" class="label">A neuron is a cell specialized for input, decision, and output</text>
      <path d="M230 260 C150 180 120 120 70 95" class="line"/>
      <path d="M230 260 C150 245 110 255 65 285" class="line"/>
      <path d="M230 260 C145 330 115 390 75 450" class="line"/>
      <path d="M230 260 C230 160 280 115 330 75" class="line"/>
      <path d="M230 260 C300 175 365 150 430 135" class="line"/>
      <circle cx="300" cy="270" r="92" fill="#ccfbf1" stroke="#0f766e" stroke-width="8"/>
      <circle cx="300" cy="270" r="34" fill="#14b8a6" opacity=".45"/>
      <path d="M392 270 C500 268 565 268 655 270 C770 274 845 280 940 270" class="line"/>
      <path d="M498 245 C512 265 512 279 498 300" stroke="#0f766e" stroke-width="8" fill="none"/>
      <path d="M612 245 C626 265 626 279 612 300" stroke="#0f766e" stroke-width="8" fill="none"/>
      <path d="M730 245 C744 265 744 279 730 300" stroke="#0f766e" stroke-width="8" fill="none"/>
      <path d="M845 245 C859 265 859 279 845 300" stroke="#0f766e" stroke-width="8" fill="none"/>
      <path d="M940 270 C1000 220 1050 210 1110 185" class="line"/>
      <path d="M940 270 C1015 275 1055 305 1120 330" class="line"/>
      <path d="M940 270 C1005 320 1040 375 1095 430" class="line"/>

      <text x="92" y="90" class="label">dendrites</text>
      <text x="74" y="121" class="small">receive many inputs</text>
      <text x="246" y="400" class="label">soma</text>
      <text x="230" y="430" class="small">cell body; integrates input</text>
      <text x="570" y="200" class="label">axon</text>
      <text x="515" y="225" class="small">output cable; spike travels this way</text>
      <text x="963" y="145" class="label">axon terminals</text>
      <text x="963" y="175" class="small">communicate with other cells</text>
      <path d="M470 335 H840" class="thin"/>
      <text x="645" y="365" class="small" text-anchor="middle">action potential direction</text>
    </svg>
    