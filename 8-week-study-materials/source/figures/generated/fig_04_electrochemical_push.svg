
    <svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <title id="title">Fig 04 Electrochemical Push</title>
  <desc id="desc">Fig 04 Electrochemical Push teaching figure for the neuroscience minibook; see surrounding caption for interpretation.</desc>
      <rect width="1200" height="560" fill="#ffffff"/>
      <defs>
        <marker id="ecarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
        </marker>
        <style>
          .label{font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:19px;fill:#334155}
          .ion{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}
          .arrow{stroke:#0f172a;stroke-width:5;fill:none;marker-end:url(#ecarr)}
          .soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3;rx:16}
        </style>
      </defs>
      <text x="55" y="58" class="label">Electrochemical force = chemical push + electrical push</text>
      <rect x="70" y="120" width="480" height="350" class="soft"/>
      <rect x="650" y="120" width="480" height="350" class="soft"/>
      <text x="310" y="165" text-anchor="middle" class="label">Chemical gradient</text>
      <text x="890" y="165" text-anchor="middle" class="label">Electrical gradient</text>
      <text x="160" y="215" class="small">many K+ inside</text>
      <text x="355" y="215" class="small">few K+ outside</text>
      <g fill="#f97316">
        <circle cx="155" cy="270" r="18"/><circle cx="205" cy="250" r="18"/><circle cx="190" cy="315" r="18"/><circle cx="250" cy="285" r="18"/><circle cx="285" cy="335" r="18"/><circle cx="130" cy="350" r="18"/>
        <circle cx="420" cy="282" r="18"/>
      </g>
      <text x="155" y="278" text-anchor="middle" class="ion">K+</text>
      <text x="205" y="258" text-anchor="middle" class="ion">K+</text>
      <text x="190" y="323" text-anchor="middle" class="ion">K+</text>
      <text x="250" y="293" text-anchor="middle" class="ion">K+</text>
      <text x="285" y="343" text-anchor="middle" class="ion">K+</text>
      <text x="130" y="358" text-anchor="middle" class="ion">K+</text>
      <text x="420" y="290" text-anchor="middle" class="ion">K+</text>
      <path d="M300 300 H390" class="arrow"/>
      <text x="345" y="392" text-anchor="middle" class="small">diffusion pushes K+ outward</text>
      <line x1="780" y1="225" x2="780" y2="380" stroke="#94a3b8" stroke-width="4"/>
      <text x="760" y="220" class="small">inside negative</text>
      <text x="920" y="220" class="small">outside positive</text>
      <rect x="735" y="260" width="90" height="90" fill="#e2e8f0" stroke="#475569" stroke-width="3" rx="12"/>
      <circle cx="960" cy="305" r="24" fill="#f97316"/><text x="960" y="313" text-anchor="middle" class="ion">K+</text>
      <text x="740" y="310" class="small">- - -</text>
      <text x="930" y="265" class="small">+ + +</text>
      <path d="M935 305 H825" class="arrow"/>
      <text x="880" y="370" text-anchor="middle" class="small">negative inside pulls K+ inward</text>
      <rect x="295" y="492" width="610" height="44" fill="#ecfeff" stroke="#0891b2" stroke-width="3" rx="14"/>
      <text x="600" y="522" text-anchor="middle" class="small">At equilibrium, the two pushes balance for one ion.</text>
    </svg>
    