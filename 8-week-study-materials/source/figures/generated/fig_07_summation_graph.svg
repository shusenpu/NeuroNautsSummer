
    <svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <title id="title">Fig 07 Summation Graph</title>
  <desc id="desc">Fig 07 Summation Graph teaching figure for the neuroscience minibook; see surrounding caption for interpretation.</desc>
      <rect width="1200" height="600" fill="#ffffff"/>
      <defs>
        <style>
          .label{font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#334155}
          .axis{stroke:#334155;stroke-width:3}
          .trace{stroke:#0f766e;stroke-width:5;fill:none}
        </style>
      </defs>
      <text x="55" y="58" class="label">Synaptic inputs can add across time or space</text>
      <rect x="70" y="115" width="500" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" rx="18"/>
      <rect x="630" y="115" width="500" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" rx="18"/>
      <text x="320" y="155" text-anchor="middle" class="label">Temporal summation</text>
      <text x="880" y="155" text-anchor="middle" class="label">Spatial summation</text>
      <line x1="120" y1="440" x2="530" y2="440" class="axis"/><line x1="120" y1="210" x2="120" y2="440" class="axis"/>
      <line x1="680" y1="440" x2="1090" y2="440" class="axis"/><line x1="680" y1="210" x2="680" y2="440" class="axis"/>
      <line x1="120" y1="270" x2="530" y2="270" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8"/>
      <line x1="680" y1="270" x2="1090" y2="270" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="132" y="260" class="small">threshold</text><text x="692" y="260" class="small">threshold</text>
      <path d="M135 430 C175 430 175 390 205 380 C235 370 250 430 280 430 C305 430 310 380 340 370 C370 360 395 430 420 430 C450 430 450 345 485 275" class="trace"/>
      <text x="320" y="480" text-anchor="middle" class="small">same synapse fires repeatedly</text>
      <path d="M700 430 C760 430 770 405 810 390 C850 375 875 360 915 335 C955 310 985 285 1030 250" class="trace"/>
      <text x="880" y="480" text-anchor="middle" class="small">different synapses combine at the trigger zone</text>
