
    <svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <title id="title">K Balance Resting</title>
  <desc id="desc">K Balance Resting teaching figure for the neuroscience minibook; see surrounding caption for interpretation.</desc>
      <rect width="1200" height="650" fill="#ffffff"/>
      <defs>
        <marker id="kbarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
        </marker>
        <style>
          .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
          .label{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#334155}
          .k{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;fill:#0f766e}
          .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3;rx:18}
          .mem{fill:#fde68a;stroke:#d97706;stroke-width:4}
          .arrow{stroke:#0f172a;stroke-width:5;fill:none;marker-end:url(#kbarr)}
        </style>
      </defs>
      <text x="55" y="58" class="title">Resting potential: two tendencies on K+</text>
      <text x="55" y="92" class="small">K+ is crowded inside, so diffusion pushes it outward. As positive charge leaves, the negative inside pulls K+ back inward.</text>
      <rect x="70" y="135" width="1060" height="385" class="panel"/>
      <rect x="575" y="165" width="55" height="300" class="mem"/>
      <text x="320" y="178" text-anchor="middle" class="label">inside: high K+</text>
      <text x="875" y="178" text-anchor="middle" class="label">outside: lower K+</text>
      <text x="160" y="255" class="k">K+</text><text x="230" y="250" class="k">K+</text><text x="300" y="270" class="k">K+</text><text x="385" y="245" class="k">K+</text><text x="460" y="275" class="k">K+</text>
      <text x="190" y="350" class="k">K+</text><text x="285" y="360" class="k">K+</text><text x="395" y="355" class="k">K+</text><text x="490" y="345" class="k">K+</text>
      <text x="800" y="280" class="k">K+</text><text x="930" y="350" class="k">K+</text>
      <path d="M500 260 C540 240 580 240 650 260" class="arrow"/>
      <text x="600" y="235" text-anchor="middle" class="small">chemical push outward</text>
      <path d="M700 375 C650 405 595 405 520 380" class="arrow"/>
      <text x="610" y="440" text-anchor="middle" class="small">electrical pull inward</text>
      <rect x="210" y="545" width="780" height="58" fill="#ecfeff" stroke="#0891b2" stroke-width="3" rx="16"/>
      <text x="600" y="582" text-anchor="middle" class="label">Resting Vm occurs where these tendencies partly balance.</text>
    </svg>
    