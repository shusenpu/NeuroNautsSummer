      </g>
      <text x="250" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="350" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="450" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="550" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="650" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="750" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="850" y="214" text-anchor="middle" class="charge" fill="#fff">+</text><text x="950" y="214" text-anchor="middle" class="charge" fill="#fff">+</text>
      <text x="250" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="350" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="450" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="550" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="650" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="750" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="850" y="344" text-anchor="middle" class="charge" fill="#fff">-</text><text x="950" y="344" text-anchor="middle" class="charge" fill="#fff">-</text>
      <text x="600" y="470" text-anchor="middle" class="label">Q = C V: more voltage means more separated charge for the same capacitance.</text>
