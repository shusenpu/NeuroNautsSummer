
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
      <rect width="1200" height="540" fill="#ffffff"/>
      <defs>
        <style>
          .label{font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:19px;fill:#334155}
          .charge{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700}
        </style>
      </defs>
      <text x="55" y="58" class="label">The membrane stores separated charge like a capacitor</text>
      <rect x="150" y="130" width="900" height="95" fill="#ecfeff" stroke="#0891b2" stroke-width="4" rx="18"/>
      <rect x="150" y="315" width="900" height="95" fill="#fff7ed" stroke="#ea580c" stroke-width="4" rx="18"/>
      <rect x="150" y="225" width="900" height="90" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
      <text x="600" y="178" text-anchor="middle" class="label">outside fluid</text>
      <text x="600" y="370" text-anchor="middle" class="label">inside fluid</text>
      <text x="600" y="278" text-anchor="middle" class="small">thin insulating lipid bilayer</text>
      <g fill="#ef4444">
        <circle cx="250" cy="205" r="18"/><circle cx="350" cy="205" r="18"/><circle cx="450" cy="205" r="18"/><circle cx="550" cy="205" r="18"/><circle cx="650" cy="205" r="18"/><circle cx="750" cy="205" r="18"/><circle cx="850" cy="205" r="18"/><circle cx="950" cy="205" r="18"/>
      </g>
      <g fill="#475569">
