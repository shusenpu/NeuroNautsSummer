<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#ffffff"/>
  <defs>
    <marker id="mp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:800;fill:#0f172a}
      .label{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#334155}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#475569}
      .wire{stroke:#334155;stroke-width:5;fill:none}
      .arrow{stroke:#0f172a;stroke-width:4;fill:none;marker-end:url(#mp_arrow)}
      .mem{fill:#fef3c7;stroke:#d97706;stroke-width:4}
      .inside{fill:#dbeafe;stroke:#2563eb;stroke-width:3}
      .outside{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3}
    </style>
  </defs>
  <text x="55" y="62" class="title">Measuring membrane potential</text>
  <text x="55" y="96" class="small">Voltage is measured as inside relative to outside. A negative reading means the inside is lower than the outside reference.</text>

  <rect x="80" y="150" width="640" height="340" rx="24" class="outside"/>
  <text x="125" y="190" class="label">outside reference: 0 mV</text>
  <ellipse cx="400" cy="330" rx="230" ry="115" class="mem"/>
  <ellipse cx="400" cy="330" rx="195" ry="85" class="inside"/>
  <text x="340" y="338" class="label">inside</text>
  <text x="328" y="366" class="small">about -70 mV</text>

  <line x1="420" y1="80" x2="420" y2="330" class="wire"/>
  <circle cx="420" cy="330" r="10" fill="#0f172a"/>
  <text x="445" y="145" class="small">recording electrode inside</text>

  <line x1="225" y1="115" x2="225" y2="240" class="wire"/>
  <circle cx="225" cy="240" r="10" fill="#0f172a"/>
  <text x="95" y="130" class="small">reference electrode outside</text>

  <rect x="785" y="205" width="290" height="190" rx="22" fill="#0f172a"/>
  <rect x="815" y="240" width="230" height="85" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="930" y="295" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800" fill="#0f172a">-70 mV</text>
  <text x="930" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#e2e8f0">inside minus outside</text>
  <path d="M420 80 C610 82 725 160 835 235" class="wire"/>
  <path d="M225 115 C500 35 755 95 910 205" class="wire"/>

  <rect x="190" y="525" width="820" height="58" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="561" text-anchor="middle" class="small">Do not read -70 mV as "only negative charges inside"; the whole cell remains nearly neutral overall.</text>
</svg>
