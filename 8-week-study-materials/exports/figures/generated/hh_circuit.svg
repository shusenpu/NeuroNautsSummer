
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
      <rect width="1200" height="640" fill="#ffffff"/>
      <defs>
        <style>
          .wire{stroke:#0f172a;stroke-width:5;fill:none;stroke-linecap:round}
          .thin{stroke:#334155;stroke-width:3;fill:none}
          .box{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:10}
          .cap{stroke:#0f172a;stroke-width:7}
          .label{font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#334155}
        </style>
      </defs>
      <text x="55" y="60" class="label">Hodgkin-Huxley idea: replace membrane biophysics with a circuit diagram</text>
      <path d="M170 160 H1030" class="wire"/>
      <path d="M170 510 H1030" class="wire"/>
      <text x="92" y="170" class="small">outside</text>
      <text x="104" y="515" class="small">inside</text>

      <path d="M260 160 V270" class="wire"/>
      <line x1="230" y1="270" x2="290" y2="270" class="cap"/>
      <line x1="230" y1="300" x2="290" y2="300" class="cap"/>
      <path d="M260 300 V510" class="wire"/>
      <text x="210" y="360" class="label">Cm</text>
      <text x="160" y="392" class="small">membrane</text>
      <text x="160" y="417" class="small">capacitance</text>

      <path d="M465 160 V215" class="wire"/>
      <rect x="395" y="215" width="140" height="70" class="box"/>
      <text x="465" y="258" text-anchor="middle" class="label">g_Na</text>
      <path d="M465 285 V355" class="wire"/>
      <circle cx="465" cy="390" r="35" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
      <text x="465" y="398" text-anchor="middle" class="small">ENa</text>
      <path d="M465 425 V510" class="wire"/>
      <text x="365" y="560" class="small">Na+ path: opens fast during spike</text>

      <path d="M675 160 V215" class="wire"/>
      <rect x="605" y="215" width="140" height="70" class="box"/>
      <text x="675" y="258" text-anchor="middle" class="label">g_K</text>
      <path d="M675 285 V355" class="wire"/>
      <circle cx="675" cy="390" r="35" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
      <text x="675" y="398" text-anchor="middle" class="small">EK</text>
      <path d="M675 425 V510" class="wire"/>
      <text x="602" y="560" class="small">K+ path: opens later</text>

      <path d="M885 160 V215" class="wire"/>
      <rect x="815" y="215" width="140" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="3" rx="10"/>
      <text x="885" y="258" text-anchor="middle" class="label">gL</text>
      <path d="M885 285 V355" class="wire"/>
      <circle cx="885" cy="390" r="35" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
      <text x="885" y="398" text-anchor="middle" class="small">EL</text>
      <path d="M885 425 V510" class="wire"/>
      <text x="812" y="560" class="small">leak path: always partly open</text>
    </svg>
    