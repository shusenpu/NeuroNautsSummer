
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
      <rect width="1200" height="580" fill="#ffffff"/>
      <defs>
        <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
        </marker>
        <style>
          .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
          .label{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:700;fill:#0f172a}
          .small{font-family:Inter,Arial,sans-serif;font-size:19px;fill:#334155}
          .ion{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700}
          .arrow{stroke:#0f172a;stroke-width:4;fill:none;marker-end:url(#arrow3)}
        </style>
      </defs>
      <text x="60" y="55" class="title">Resting membrane potential: chemistry sets up electrical imbalance</text>
      <rect x="60" y="105" width="1080" height="170" fill="#ecfeff" stroke="#0891b2" stroke-width="3" rx="14"/>
      <rect x="60" y="305" width="1080" height="190" fill="#f8fafc" stroke="#64748b" stroke-width="3" rx="14"/>
      <text x="90" y="145" class="label">Outside cell: more Na+ and Cl-</text>
      <text x="90" y="345" class="label">Inside cell: more K+ and large negative proteins</text>

      <rect x="80" y="275" width="1040" height="30" fill="#fde68a"/>
      <rect x="80" y="292" width="1040" height="30" fill="#facc15" opacity=".65"/>
      <text x="920" y="260" class="small">lipid membrane: thin insulator</text>

      <rect x="475" y="220" width="70" height="180" fill="#fed7aa" stroke="#ea580c" stroke-width="4" rx="16"/>
      <text x="510" y="315" class="ion" text-anchor="middle" fill="#9a3412">K+</text>
      <path d="M510 365 C480 390 455 410 420 435" class="arrow"/>
      <text x="305" y="455" class="small">K+ leaks outward, leaving inside more negative</text>

      <rect x="685" y="225" width="120" height="170" fill="#dbeafe" stroke="#2563eb" stroke-width="4" rx="16"/>
      <text x="745" y="285" class="ion" text-anchor="middle" fill="#1d4ed8">Na+/K+</text>
      <text x="745" y="315" class="ion" text-anchor="middle" fill="#1d4ed8">pump</text>
      <path d="M710 350 C660 370 620 385 575 405" class="arrow"/>
      <path d="M780 350 C835 330 880 300 915 260" class="arrow"/>
      <text x="820" y="425" class="small">pump maintains gradients over time</text>

      <g fill="#ef4444">
        <circle cx="210" cy="185" r="18"/><circle cx="285" cy="210" r="18"/><circle cx="360" cy="175" r="18"/>
        <circle cx="960" cy="185" r="18"/><circle cx="1030" cy="225" r="18"/>
      </g>
      <g fill="#f97316">
        <circle cx="190" cy="390" r="18"/><circle cx="255" cy="425" r="18"/><circle cx="350" cy="395" r="18"/>
        <circle cx="430" cy="445" r="18"/><circle cx="990" cy="390" r="18"/>
      </g>
      <g fill="#475569">
        <rect x="130" y="470" width="42" height="22" rx="6"/><rect x="500" y="455" width="42" height="22" rx="6"/>
        <rect x="610" y="430" width="42" height="22" rx="6"/><rect x="720" y="455" width="42" height="22" rx="6"/>
      </g>
      <text x="205" y="193" class="ion" text-anchor="middle" fill="#fff">Na+</text>
      <text x="285" y="218" class="ion" text-anchor="middle" fill="#fff">Na+</text>
      <text x="190" y="398" class="ion" text-anchor="middle" fill="#fff">K+</text>
      <text x="255" y="433" class="ion" text-anchor="middle" fill="#fff">K+</text>
      <text x="360" y="183" class="ion" text-anchor="middle" fill="#fff">Cl-</text>
      <text x="600" y="535" class="label" text-anchor="middle">At rest, a typical neuron is about -70 mV inside relative to outside.</text>
    </svg>
    