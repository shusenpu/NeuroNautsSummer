<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" fill="#ffffff"/>
  <defs>
    <marker id="wrarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .label{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#334155}
      .box{fill:#ecfeff;stroke:#0891b2;stroke-width:3;rx:16}
      .box2{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:16}
      .box3{fill:#eef2ff;stroke:#4f46e5;stroke-width:3;rx:16}
      .box4{fill:#f0fdf4;stroke:#16a34a;stroke-width:3;rx:16}
      .arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#wrarr)}
    </style>
  </defs>
  <text x="60" y="60" class="title">Eight weeks, one continuous story</text>
  <text x="60" y="95" class="small">Each week adds one layer. Do not skip layers: later ideas need the earlier vocabulary and graph skills.</text>

  <rect x="45" y="150" width="120" height="125" class="box"/>
  <text x="105" y="185" text-anchor="middle" class="label">Week A</text>
  <text x="105" y="216" text-anchor="middle" class="small">neurons</text>
  <text x="105" y="238" text-anchor="middle" class="small">signaling cells</text>

  <rect x="185" y="150" width="120" height="125" class="box"/>
  <text x="245" y="185" text-anchor="middle" class="label">Week B</text>
  <text x="245" y="216" text-anchor="middle" class="small">ions</text>
  <text x="245" y="238" text-anchor="middle" class="small">negative rest</text>

  <rect x="325" y="150" width="120" height="125" class="box2"/>
  <text x="385" y="185" text-anchor="middle" class="label">Week C</text>
  <text x="385" y="216" text-anchor="middle" class="small">graded signals</text>
  <text x="385" y="238" text-anchor="middle" class="small">threshold</text>

  <rect x="465" y="150" width="120" height="125" class="box2"/>
  <text x="525" y="185" text-anchor="middle" class="label">Week D</text>
  <text x="525" y="216" text-anchor="middle" class="small">spikes begin</text>
  <text x="525" y="238" text-anchor="middle" class="small">and travel</text>

  <rect x="605" y="150" width="120" height="125" class="box3"/>
  <text x="665" y="185" text-anchor="middle" class="label">Week E</text>
  <text x="665" y="216" text-anchor="middle" class="small">spike trains</text>
  <text x="665" y="238" text-anchor="middle" class="small">information</text>

  <rect x="745" y="150" width="120" height="125" class="box3"/>
  <text x="805" y="185" text-anchor="middle" class="label">Week F</text>
  <text x="805" y="216" text-anchor="middle" class="small">HH intuition</text>
  <text x="805" y="238" text-anchor="middle" class="small">circuits</text>

  <rect x="885" y="150" width="120" height="125" class="box3"/>
  <text x="945" y="185" text-anchor="middle" class="label">Week G</text>
  <text x="945" y="216" text-anchor="middle" class="small">channels</text>
  <text x="945" y="238" text-anchor="middle" class="small">variability</text>

  <rect x="1025" y="150" width="120" height="125" class="box4"/>
  <text x="1085" y="185" text-anchor="middle" class="label">Week H</text>
  <text x="1085" y="216" text-anchor="middle" class="small">evidence</text>
  <text x="1085" y="238" text-anchor="middle" class="small">final talk</text>

  <path d="M165 212 H177" class="arrow"/>
  <path d="M305 212 H317" class="arrow"/>
  <path d="M445 212 H457" class="arrow"/>
  <path d="M585 212 H597" class="arrow"/>
  <path d="M725 212 H737" class="arrow"/>
  <path d="M865 212 H877" class="arrow"/>
  <path d="M1005 212 H1017" class="arrow"/>

  <rect x="90" y="355" width="1020" height="95" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" rx="18"/>
  <text x="600" y="392" text-anchor="middle" class="label">Final story</text>
  <text x="600" y="424" text-anchor="middle" class="small">shape supports signaling, ions create voltage, synapses approach threshold, spikes and spike trains carry information, and noise changes timing.</text>
</svg>
