<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Membrane potential measurement diagram</title>
  <desc id="desc">Cell membrane with one electrode inside, one outside, and a meter reading negative seventy millivolts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Measuring membrane potential</text><text x="64" y="82" class="subtitle">Inside is measured relative to outside</text><ellipse cx="580" cy="390" rx="260" ry="150" fill="#ecfeff" stroke="#0f766e" stroke-width="6"/><ellipse cx="580" cy="390" rx="230" ry="122" fill="#ffffff" stroke="#99f6e4" stroke-width="3"/><line x1="580" y1="120" x2="580" y2="385" stroke="#172033" stroke-width="5" stroke-linecap="round" class=""/><line x1="850" y1="245" x2="700" y2="325" stroke="#172033" stroke-width="5" stroke-linecap="round" class=""/><rect x="455" y="72" width="250" height="76" fill="#f8fafc" stroke="#172033" stroke-width="4" rx="12"/><text x="580" y="122" class="title" text-anchor="middle">-70 mV</text><text x="500" y="410" class="label" text-anchor="middle">inside</text><text x="900" y="245" class="label" text-anchor="start">outside reference</text><text x="582" y="182" class="small" text-anchor="middle">intracellular electrode</text><text x="390" y="335" class="label" text-anchor="middle">+</text><text x="430" y="335" class="label" text-anchor="middle">+</text><text x="470" y="335" class="label" text-anchor="middle">+</text><text x="690" y="335" class="label" text-anchor="middle">+</text><text x="730" y="335" class="label" text-anchor="middle">+</text><text x="770" y="335" class="label" text-anchor="middle">+</text><text x="420" y="455" class="label" text-anchor="middle">-</text><text x="470" y="455" class="label" text-anchor="middle">-</text><text x="690" y="455" class="label" text-anchor="middle">-</text><text x="745" y="455" class="label" text-anchor="middle">-</text><text x="600" y="650" class="label" text-anchor="middle">V_m = voltage inside the cell compared with outside</text>
</svg>
