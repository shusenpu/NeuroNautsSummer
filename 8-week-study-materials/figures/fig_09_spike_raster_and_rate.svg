<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Spike raster with rate comparison</title>
  <desc id="desc">Raster plot showing more frequent spike ticks for stronger stimulus conditions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Spike raster with rate comparison</text><text x="64" y="82" class="subtitle">More intensity can mean more spikes</text><line x1="130" y1="580" x2="1010" y2="580" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="130" y1="160" x2="130" y2="580" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="570.0" y="628" class="small" text-anchor="middle">Time (ms)</text>
<text x="76" y="370.0" class="small" text-anchor="middle" transform="rotate(-90 76 370.0)">Stimulus condition</text><text x="105" y="236" class="label" text-anchor="end">weak touch</text><line x1="130" y1="275" x2="1010" y2="275" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><line x1="130" y1="195" x2="130" y2="265" stroke="#4b5b73" stroke-width="5" stroke-linecap="round" class=""/><line x1="385" y1="195" x2="385" y2="265" stroke="#4b5b73" stroke-width="5" stroke-linecap="round" class=""/><line x1="710" y1="195" x2="710" y2="265" stroke="#4b5b73" stroke-width="5" stroke-linecap="round" class=""/><line x1="940" y1="195" x2="940" y2="265" stroke="#4b5b73" stroke-width="5" stroke-linecap="round" class=""/><text x="1050" y="235" class="label" text-anchor="start">4 Hz</text><text x="105" y="366" class="label" text-anchor="end">medium touch</text><line x1="130" y1="405" x2="1010" y2="405" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><line x1="180" y1="325" x2="180" y2="395" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="330" y1="325" x2="330" y2="395" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="475" y1="325" x2="475" y2="395" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="650" y1="325" x2="650" y2="395" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="795" y1="325" x2="795" y2="395" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="950" y1="325" x2="950" y2="395" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><text x="1050" y="365" class="label" text-anchor="start">6 Hz</text><text x="105" y="496" class="label" text-anchor="end">strong touch</text><line x1="130" y1="535" x2="1010" y2="535" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><line x1="135" y1="455" x2="135" y2="525" stroke="#ea580c" stroke-width="5" stroke-linecap="round" class=""/><l