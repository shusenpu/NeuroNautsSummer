<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">HH equivalent circuit</title>
  <desc id="desc">Circuit diagram showing membrane capacitor with sodium, potassium, and leak branches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Hodgkin-Huxley equivalent circuit</text><text x="64" y="82" class="subtitle">Membrane pathways as conductances and reversal potentials</text><line x1="170" y1="170" x2="170" y2="610" stroke="#172033" stroke-width="4" stroke-linecap="round" class=""/><line x1="980" y1="170" x2="980" y2="610" stroke="#172033" stroke-width="4" stroke-linecap="round" class=""/><line x1="170" y1="240" x2="330" y2="240" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="330" y1="240" x2="330" y2="540" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="330" y1="540" x2="980" y2="540" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="170" y1="240" x2="520" y2="240" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="520" y1="240" x2="520" y2="540" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="520" y1="540" x2="980" y2="540" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="170" y1="240" x2="710" y2="240" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="710" y1="240" x2="710" y2="540" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><line x1="710" y1="540" x2="980" y2="540" stroke="#172033" stroke-width="3" stroke-linecap="round" class=""/><path d="M 230 310 L 230 380 M 255 310 L 255 380" stroke="#172033" stroke-width="5"/><text x="242" y="405" class="label" text-anchor="middle">C_m</text><rect x="288" y="300" width="84" height="46" fill="#fff" stroke="#2563eb" stroke-width="4" rx="8"/><text x="330" y="330" class="label" text-anchor="middle">g_Na</text><circle cx="330" cy="430" r="34" fill="#fff7ed" stroke="#2563eb" stroke-width="4"/><text x="330" y="438" class="small" text-anchor="middle">E_Na</text><rect x="478" y="300" width="84" height="46" fill="#fff" stroke="#0f766e" stroke-width="4" rx="8"/><text x="520" y="330" class="label" text-anchor="middle">g_K</text><circle cx="520" cy="430" r="34" fill="#fff7ed" stroke="#0f766e" stroke-width="4"/><text x="520" y="438" class="small" text-anchor="middle">E_K</text><rect x="668" y="300" width="84" height="46" fill="#fff" stroke="#ea580c" stroke-width="4" rx="8"/><text x="710" y="330" class="label" text-anchor="middle">g_L</text><circle cx="710" cy="430" r="34" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="710" y="438" class="small" text-anchor="middle">E_L</text><line x1="100" y1="390" x2="165" y2="390" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" class=""/><text x="90" y="375" class="label" text-anchor="end">I_app</text><text x="575" y="120" class="title" text-anchor="middle">V_m</text><text x="575" y="680" class="label" text-anchor="middle">Each branch pulls V_m toward its reversal potential.</text>
</svg>
