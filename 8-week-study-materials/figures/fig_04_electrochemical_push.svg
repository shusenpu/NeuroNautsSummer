<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Electrochemical gradient diagram</title>
  <desc id="desc">Diagram showing potassium pushed outward by concentration and pulled inward by negative charge inside.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Electrochemical gradient for K+</text><text x="64" y="82" class="subtitle">Two forces can point in opposite directions</text><rect x="520" y="150" width="130" height="450" fill="#e2e8f0" stroke="#c9d5e3" stroke-width="3"/><text x="260" y="150" class="label" text-anchor="middle">inside: high K+</text><text x="895" y="150" class="label" text-anchor="middle">outside: low K+</text><circle cx="170" cy="250" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="170" y="256" class="tiny" text-anchor="middle">K+</text><circle cx="170" cy="340" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="170" y="346" class="tiny" text-anchor="middle">K+</text><circle cx="170" cy="450" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="170" y="456" class="tiny" text-anchor="middle">K+</text><circle cx="170" cy="535" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="170" y="541" class="tiny" text-anchor="middle">K+</text><circle cx="230" cy="250" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="230" y="256" class="tiny" text-anchor="middle">K+</text><circle cx="230" cy="340" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="230" y="346" class="tiny" text-anchor="middle">K+</text><circle cx="230" cy="450" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="230" y="456" class="tiny" text-anchor="middle">K+</text><circle cx="230" cy="535" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="230" y="541" class="tiny" text-anchor="middle">K+</text><circle cx="300" cy="250" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="300" y="256" class="tiny" text-anchor="middle">K+</text><circle cx="300" cy="340" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="300" y="346" class="tiny" text-anchor="middle">K+</text><circle cx="300" cy="450" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="300" y="456" class="tiny" text-anchor="middle">K+</text><circle cx="300" cy="535" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="300" y="541" class="tiny" text-anchor="middle">K+</text><circle cx="375" cy="250" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="375" y="256" class="tiny" text-anchor="middle">K+</text><circle cx="375" cy="340" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="375" y="346" class="tiny" text-anchor="middle">K+</text><circle cx="375" cy="450" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="375" y="456" class="tiny" text-anchor="middle">K+</text><circle cx="375" cy="535" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="375" y="541" class="tiny" text-anchor="middle">K+</text><circle cx="430" cy="250" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="430" y="256" class="tiny" text-anchor="middle">K+</text><circle cx="430" cy="340" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="430" y="346" class="tiny" text-anchor="middle">K+</text><circle cx="430" cy="450" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="430" y="456" class="tiny" text-anchor="middle">K+</text><circle cx="430" cy="535" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="430" y="541" class="tiny" text-anchor="middle">K+</text><circle cx="470" cy="250" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="470" y="256" class="tiny" text-anchor="middle">K+</text><circle cx="470" cy="340" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="470" y="346" class="tiny" text-anchor="middle">K+</text><circle cx="470" cy="450" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="470" y="456" class="tiny" text-anchor="middle">K+</text><circle cx="470" cy="535" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="470" y="541" class="tiny" text-anchor="middle">K+</text><circle cx="750" cy="300" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="750" y="306" class="tiny" text-anchor="middle">K+</text><circle cx="750" cy="480" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="750" y="486" class="tiny" text-anchor="middle">K+</text><circle cx="860" cy="300" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="860" y="306" class="tiny" text-anchor="middle">K+</text><circle cx="860" cy="480" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="860" y="486" class="tiny" text-anchor="middle">K+</text><circle cx="980" cy="300" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="980" y="306" class="tiny" text-anchor="middle">K+</text><circle cx="980" cy="480" r="19" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/><text x="980" y="486" class="tiny" text-anchor="middle">K+</text><line x1="410" y1="350" x2="715" y2="350" stroke="#ea580c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" class=""/><text x="565" y="320" class="label" text-anchor="middle">concentration push outward</text><line x1="780" y1="455" x2="475" y2="455" stroke="#0f766e" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" class=""/><text x="640" y="500" class="label" text-anchor="middle">electrical pull inward</text><text x="250" y="635" class="small" text-anchor="middle">negative interior builds as K+ leaves</text><text x="600" y="685" class="label" text-anchor="middle">Balance point for one ion = equilibrium potential</text>
</svg>
