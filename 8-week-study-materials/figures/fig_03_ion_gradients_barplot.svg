<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ion gradient comparison</title>
  <desc id="desc">Bar chart comparing intracellular and extracellular concentrations of four major ions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Ion gradient comparison</text><text x="64" y="82" class="subtitle">Illustrative inside/outside concentrations</text><line x1="120" y1="610" x2="1000" y2="610" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="120" y1="140" x2="120" y2="610" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="560.0" y="658" class="small" text-anchor="middle">Ion</text>
<text x="66" y="375.0" class="small" text-anchor="middle" transform="rotate(-90 66 375.0)">Approximate concentration (mM)</text><line x1="114" y1="610.0" x2="1000" y2="610.0" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><text x="102" y="615.0" class="tiny" text-anchor="end">0</text><line x1="114" y1="453.33333333333337" x2="1000" y2="453.33333333333337" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><text x="102" y="458.33333333333337" class="tiny" text-anchor="end">50</text><line x1="114" y1="296.6666666666667" x2="1000" y2="296.6666666666667" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><text x="102" y="301.6666666666667" class="tiny" text-anchor="end">100</text><line x1="114" y1="140.0" x2="1000" y2="140.0" stroke="#e5edf5" stroke-width="1" stroke-linecap="round" class=""/><text x="102" y="145.0" class="tiny" text-anchor="end">150</text><rect x="194.0" y="572.4" width="34" height="37.6" fill="#0f766e" rx="5"/><rect x="236.0" y="155.66666666666669" width="34" height="454.3333333333333" fill="#ea580c" rx="5"/><text x="230.0" y="635" class="label" text-anchor="middle">Na+</text><rect x="414.0" y="171.33333333333331" width="34" height="438.6666666666667" fill="#0f766e" rx="5"/><rect x="456.0" y="594.3333333333334" width="34" height="15.666666666666666" fill="#ea580c" rx="5"/><text x="450.0" y="635" class="label" text-anchor="middle">K+</text><rect x="634.0" y="578.6666666666666" width="34" height="31.333333333333332" fill="#0f766e" rx="5"/><rect x="676.0" y="265.3333333333333" width="34" height="344.6666666666667" fill="#ea580c" rx="5"/><text x="670.0" y="635" class="label" text-anchor="middle">Cl-</text><rect x="854.0" y="609.9996866666667" width="34" height="0.0003133333333333333" fill="#0f766e" rx="5"/><rect x="896.0" y="603.7333333333333" width="34" height="6.266666666666667" fill="#ea580c" rx="5"/><text x="890.0" y="635" class="label" text-anchor="middle">Ca2+</text><rect x="1030" y="180" width="28" height="18" fill="#0f766e"/><text x="1070" y="195" class="small" text-anchor="start">Inside</text><rect x="1030" y="220" width="28" height="18" fill="#ea580c"/><text x="1070" y="235" class="small" text-anchor="start">Outside</text><text x="600" y="705" class="label" text-anchor="middle">Pattern to notice: K+ is high inside; Na+ and Ca2+ are high outside.</text>
</svg>
