<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Neuron morphology gallery</title>
  <desc id="desc">Gallery of neuron morphologies showing diverse branching patterns and cell body positions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Neuron morphology gallery</text><text x="64" y="82" class="subtitle">Different shapes, same signaling problem</text><rect x="65" y="175" width="370" height="405" class="panel"/>
