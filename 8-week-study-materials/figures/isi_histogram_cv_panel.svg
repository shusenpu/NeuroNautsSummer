<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ISI histogram and CV panel</title>
  <desc id="desc">Panel with spike times, interspike-interval histogram, and summary box showing mean ISI, standard deviation, and CV.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">ISI histogram and CV panel</text><text x="64" y="82" class="subtitle">Intervals become a distribution</text><rect x="80" y="120" width="1040" height="120" class="panel"/><text x="140" y="170" class="label" text-anchor="start">spike times:</text><line x1="300" y1="155" x2="300" y2="220" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="390" y1="155" x2="390" y2="220" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="520" y1="155" x2="520" y2="220" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="670" y1="155" x2="670" y2="220" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><line x1="850" y1="155" x2="850" y2="220" stroke="#0f766e" stroke-width="5" stroke-linecap="round" class=""/><text x="575" y="230" class="small" text-anchor="middle">Interspike intervals are gaps between neighboring spikes.</text><rect x="80" y="300" width="650" height="350" class="panel"/><line x1="160" y1="570" x2="630" y2="570" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="160" y1="360" x2="160" y2="570" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="395.0" y="618" class="small" text-anchor="middle">Interspike interval (ms)</text>
<text x="106" y="465.0" class="small" text-anchor="middle" transform="rotate(-90 106 465.0)">Count</text><rect x="205" y="500" width="48" height="70" fill="#2563eb" rx="5"/><rect x="285" y="430" width="48" height="140" fill="#2563eb" rx="5"/><rect x="365" y="470" width="48" height="100" fill="#2563eb" rx="5"/><rect x="445" y="515" width="48" height="55" fill="#2563eb" rx="5"/><rect x="525" y="540" width="48" height="30" fill="#2563eb" rx="5"/><rect x="780" y="300" width="340" height="350" class="panel"/><text x="950" y="355" class="label" text-anchor="middle">Summary metrics</text><text x="835" y="425" class="label" text-anchor="start">mean ISI = 50 ms</text><text x="835" y="485" class="label" text-anchor="start">SD of ISI = 10 ms</text><text x="835" y="545" class="label" text-anchor="start">CV = SD / mean</text><text x="835" y="600" class="label" text-anchor="start">CV = 10 / 50 = 0.20</text>
</svg>
