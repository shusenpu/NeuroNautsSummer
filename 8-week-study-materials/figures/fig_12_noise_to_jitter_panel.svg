<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Repeated-trial spike jitter panel</title>
  <desc id="desc">Voltage traces and spike-time summaries comparing low-noise and high-noise repeated trials.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Repeated-trial spike jitter panel</text><text x="64" y="82" class="subtitle">Noise shifts threshold crossing time</text><rect x="70" y="125" width="500" height="260" class="panel"/><line x1="130" y1="325" x2="490" y2="325" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="130" y1="175" x2="130" y2="325" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="310.0" y="373" class="small" text-anchor="middle">Time (ms)</text>
<text x="76" y="250.0" class="small" text-anchor="middle" transform="rotate(-90 76 250.0)">V_m (mV)</text><line x1="130" y1="235" x2="490" y2="235" stroke="#dc2626" stroke-width="2" stroke-linecap="round" class=""/><path d="M 130 300 C 230 300, 285 260, 330 225.0 C 375 185, 420 205, 490 280" fill="none" stroke="#0f766e" stroke-width="4" opacity="0.8"/><path d="M 130 300 C 230 300, 285 278, 330 234.0 C 375 203, 420 223, 490 280" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.8"/><path d="M 130 300 C 230 300, 285 246, 330 218.0 C 375 171, 420 191, 490 280" fill="none" stroke="#ea580c" stroke-width="4" opacity="0.8"/><text x="300" y="155" class="label" text-anchor="middle">A. repeated voltage traces</text><rect x="630" y="125" width="500" height="260" class="panel"/><line x1="700" y1="325" x2="1040" y2="325" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="700" y1="175" x2="700" y2="325" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="870.0" y="373" class="small" text-anchor="middle">Time (ms)</text>
<text x="646" y="250.0" class="small" text-anchor="middle" transform="rotate(-90 646 250.0)">Trial</text><line x1="820" y1="190" x2="820" y2="210" stroke="#0f766e" stroke-width="4" stroke-linecap="round" class=""/><text x="682" y="205" class="tiny" text-anchor="end">1</text><line x1="850" y1="218" x2="850" y2="238" stroke="#0f766e" stroke-width="4" stroke-linecap="round" class=""/><text x="682" y="233" class="tiny" text-anchor="end">2</text><line x1="795" y1="246" x2="795" y2="266" stroke="#0f766e" stroke-width="4" stroke-linecap="round" class=""/><text x="682" y="261" class="tiny" text-anchor="end">3</text><line x1="870" y1="274" x2="870" y2="294" stroke="#0f766e" stroke-width="4" stroke-linecap="round" class=""/><text x="682" y="289" class="tiny" text-anchor="end">4</text><line x1="835" y1="302" x2="835" y2="322" stroke="#0f766e" stroke-width="4" stroke-linecap="round" class=""/><text x="682" y="317" class="tiny" text-anchor="end">5</text><text x="880" y="155" class="label" text-anchor="middle">B. spike-time jitter</text><rect x="210" y="455" width="780" height="210" class="panel"/><line x1="300" y1="605" x2="800" y2="605" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="300" y1="500" x2="300" y2="605" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="550.0" y="653" class="small" text-anchor="middle">Noise condition</text>
<text x="246" y="552.5" class="small" text-anchor="middle" transform="rotate(-90 246 552.5)">CV</text><rect x="400" y="560" width="70" height="45" fill="#0f766e" rx="6"/><rect x="625" y="510" width="70" height="95" fill="#ea580c" rx="6"/><text x="435" y="635" class="small" text-anchor="middle">low</text><text x="660" y="635" class="small" text-anchor="middle">high</text><text x="605" y="480" class="label" text-anchor="middle">C. variability summary</text>
</svg>
