<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synapse schematic with EPSP and IPSP</title>
  <desc id="desc">Presynaptic terminal releasing transmitter onto postsynaptic membrane with excitatory and inhibitory voltage examples.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f7fafc; stroke: #c9d5e3; stroke-width: 2; rx: 18; }
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5b73; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 500 15px Arial, sans-serif; fill: #4b5b73; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #4b5b73; }
      .axis { stroke: #172033; stroke-width: 2; }
      .grid { stroke: #e5edf5; stroke-width: 1; }
      .trace { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-trace { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .blue-trace { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .teal-fill { fill: #ccfbf1; stroke: #0f766e; stroke-width: 4; }
      .orange-fill { fill: #fed7aa; stroke: #ea580c; stroke-width: 4; }
      .blue-fill { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .green-fill { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .red-fill { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="64" y="48" class="title">Synapse schematic with EPSP and IPSP</text><text x="64" y="82" class="subtitle">Chemical communication changes postsynaptic voltage</text><circle cx="310" cy="280" r="120" class="blue-fill"/><rect x="250" y="350" width="520" height="78" class="teal-fill"/><text x="310" y="155" class="label" text-anchor="middle">presynaptic terminal</text><text x="520" y="470" class="small" text-anchor="middle">synaptic cleft</text><text x="520" y="535" class="label" text-anchor="middle">postsynaptic membrane with receptors</text><circle cx="250" cy="260" r="18" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="260" r="18" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/><circle cx="350" cy="260" r="18" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/><circle cx="405" cy="320" r="8" fill="#7c3aed"/><circle cx="450" cy="345" r="8" fill="#7c3aed"/><circle cx="500" cy="370" r="8" fill="#7c3aed"/><circle cx="550" cy="350" r="8" fill="#7c3aed"/><rect x="450" y="374" width="28" height="54" fill="#fef3c7" stroke="#ea580c" stroke-width="3" rx="6"/><rect x="520" y="374" width="28" height="54" fill="#fef3c7" stroke="#ea580c" stroke-width="3" rx="6"/><rect x="590" y="374" width="28" height="54" fill="#fef3c7" stroke="#ea580c" stroke-width="3" rx="6"/><line x1="390" y1="320" x2="565" y2="375" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" class=""/><rect x="820" y="150" width="300" height="175" class="panel"/><line x1="860" y1="280" x2="1070" y2="280" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="860" y1="190" x2="860" y2="280" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="965.0" y="328" class="small" text-anchor="middle">Time (ms)</text>
<text x="806" y="235.0" class="small" text-anchor="middle" transform="rotate(-90 806 235.0)">V_m</text><path d="M 860 255 C 900 255, 925 225, 960 225 C 1000 225, 1025 252, 1070 252" class="trace"/><text x="970" y="175" class="small" text-anchor="middle">EPSP: toward threshold</text><rect x="820" y="390" width="300" height="175" class="panel"/><line x1="860" y1="520" x2="1070" y2="520" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<line x1="860" y1="430" x2="860" y2="520" stroke="#172033" stroke-width="2" stroke-linecap="round" class=""/>
<text x="965.0" y="568" class="small" text-anchor="middle">Time (ms)</text>
<text x="806" y="475.0" class="small" text-anchor="middle" transform="rotate(-90 806 475.0)">V_m</text><path d="M 860 485 C 900 485, 925 520, 960 520 C 1000 520, 1025 488, 1070 488" class="orange-trace"/><text x="970" y="415" class="small" text-anchor="middle">IPSP: away from threshold</text>
</svg>
